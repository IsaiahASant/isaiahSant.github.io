<!doctype html>
<html lang="en" data-bs-theme="">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Path of Stealth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <style>
    </style>
  </head>
  <body>
    <div class="container text-center d-flex justify-content-center align-items-center">
      

        <h1>The Path of Stealth</h1>
        <p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct sequence of actions to avoid detection and reach your objective.</p>
        <div style = "display: flex; justify-content: center; align-items:center; flex-direction: column; margin-bottom: 35px;">
            <!-- Actions -->
            <div onclick="selectAction(this, 'hide')" class="stealth-option text-center fs-5">Hide in the shadows</div>
            <div onclick="selectAction(this, 'run')" class="stealth-option fs-5">Run quickly to the next cover</div>
            <div onclick="selectAction(this, 'distract')" class="stealth-option text-center fs-5">Create a distraction</div>
            <div onclick="selectAction(this, 'wait')" class="stealth-option text-center fs-5">Wait for the right moment</div>
            
        </div>
        <!-- Buttons -->
        <button onclick="checkSequence()">Check Sequence</button>
        <button onclick="reset()">Reset!</button>
       
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script>
      const correctSequence = ['hide', 'wait', 'distract'];
      const color = ["red", "blue", "green", "yellow"]
      let count = 0;
      let userSequence = [];
      let isFull = false;
     
      function selectAction(element, action){
        userSequence.push(action);
        if(!isFull){
          if(count < color.length){
            element.style.backgroundColor = color[count];
            count ++;
          }else{
            isFull = true;
            
          }
          console.log(userSequence);

        } 
      }

      function checkSequence(){
        let output = true;
        if(correctSequence.length !== userSequence.length) output = false;
        else{
          for(let i = 0; i < userSequence.length; i ++){
            if (userSequence[i] !== correctSequence[i]) output = false;
          }
        }
        if(output){ 
        
          alert(`Congrats! You got the right Sequence!`);
          location.href = "page6.html";
        }else{
          alert(`wrong sequence ;(`);
        }
        
        return output;
      }

      function reset(){
        userSequence = [];
        location.href="page5b.html";
        console.log(userSequence);
      }
    </script>
  </body>
</html>
