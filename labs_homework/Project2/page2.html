<!doctype html>
<html lang="en" data-bs-theme="">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link  rel="stylesheet" href="style.css">
    <stye>
        
      

    </style>
  </head>
  <body>
    <div class="container">
        <!--form content-->
        <form id="charaterForm" type="get" action="page3.html" onsubmit="return button()">
            
            <h1 class = "text-center"><strong>Choose Your Character</strong></h1>
            <fieldset class = "float-none w-auto px-2" >
              <legend class = "text-center">Choose Your Character</legend>
              <!---->
                
                <label class="text-center">
                  <input id="aria" type="radio" name = "class">
                  <strong>Aria, the Warrior:</strong> Strong an brave, with the ability to overcome physical obstacles.
                </label>
    
                <label class="text-center">
                  <input id="eldrin" type="radio" name = "class">
                  <strong>Eldrin, the Mage:</strong> Wise and knowledgeable with the power to solve puzzles and cast spells.
                </label>
                
                <label class="text-center">
                  <input id="tara" type="radio" name = "class">
                  <strong>Tara, the Rogue:</strong> Quick and cunning, with skills in stealth and persuasion.
                </label>

                
            </fieldset>
          <div class = "center">
            <input type="submit" value="Continue" >
          </div>

          

        </form>
          
        
        
        
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    
    <script>
      function button(){
      let selected = document.querySelector('input[name="class"]:checked');
      if(!selected){
        alert("Please choose a character first!");
        return false;   // stops the form submission
      }
      return true;      // allows the form to submit
    }    
        

    </script>
    
  </body>
</html>
