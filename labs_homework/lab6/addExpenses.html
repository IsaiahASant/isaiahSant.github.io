<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>
<body>
    <div>
        <form id="addExpenses" style="display: flex; flex-direction: column;" class="container mt-4">
            <h1>Add Expenses</h1>
            <div class="mb-3">
                
              <label for="name" class="form-label">Place of Expense: </label>
                <input
                    class="form-control"
                    type="text"
                    id="placeExpense"
                    required
                    pattern=".{5,}"
                    title="Input needs to be at least 5 chars long"   
                >
            </div> 

            <div class="mb-3">
                <label for="date" >Date: </label>
                <input
                    class="form-control"
                    type="date"
                    id="date"
                    required
                    title="Please enter an accurate date"
                    max=""
                    
                >
            </div>

            <div class="mb-3">
                <label for="Amount" >Expense Amount: </label>
                <input
                    class="form-control"
                    type="number"
                    id="amount"
                    required
                    min="1";
                    max="5000"
                    title="{$0, $5,000}"
                >
            </div>


            <div class="mb-3">
                <label for="form-control" class="">Expense Category </label>
                <div class=""style="border: 1px solid rgb(210, 210, 210); border-radius: 4px; padding: 5px;padding-left: 20px; padding-right: 150px; display: flex; justify-content: space-between;">
                    <label class="text-center" name="category" class="category" value="Groceries">
                      <input id="groc" type="radio">
                      Groceries
                    </label>
                
                    <label class="text-center" name="category" class="category">
                      <input id="busi" type="radio" value="Business">
                      Business
                    </label>

                    <label class="text-center" name="category" class="category" value="Restaurants">
                      <input id="rest" type="radio">
                      Restaurants
                    </label>

                    <label class="text-center">
                      <input id="fun" type="radio" name="category" class="category" value="Fun!">
                      Fun!
                    </label>
                </div>
                
            </div>


            <div class="mb-3">
                <label for="paymentMode" class="form-label">Mode of Payment: </label>
                    <select name="mode" id="mode" class="form-control" style="appearance:auto;">
                        <option value="Credit card">Credit card</option>
                        <option value="Debit card">Debit card</option>
                        <option value="Cash">Cash</option>  
                    </select>
            </div>
            


            <div class="mb-3">
                <label for="textBox" class="form-label">Rational(optional if reason is ridiculous): </label>
                <input 
                    class="form-control"
                    type="text"
                    maxlength="100"
                    id="textBox"
                >
            </div>



            <div>
              <button type="submit" class="btn btn-primary guessSubmit" >Submit</button>
            </div>



        </form>
    </div>
    
    <script>
        //disables any date past current date to be selected
        document.getElementById('date').max = new Date().toISOString().split('T')[0];

        document.getElementById("addExpenses").addEventListener("submit", function(e) {
            e.preventDefault(); // Stop the form from submitting automatically


            const placeExpense = document.getElementById("placeExpense").value;
            console.log(placeExpense);
            const date = document.getElementById("date").value;
            const amount = document.getElementById("amount").value;


            // Log to console (or do whatever you need with the data)
            console.log("Form submitted successfully!");
            console.log("source Name:", placeExpense);
            console.log("Date:", date);
            console.log("Amount: ", amount);
            let category = "";

            if (document.getElementById("groc").checked) category = "Groceries ";
            if (document.getElementById("busi").checked) category = category + "Business ";
            if (document.getElementById("rest").checked) category = category + "Restaurants ";
            if (document.getElementById("fun").checked) category = category + "Fun!";

            console.log("Category:", category);

            const mode = document.getElementById("mode").value;
            console.log("Mode of Payment: ", mode);

            const rational = document.getElementById("textBox").value;
            console.log("rational: ", rational)


            

            
            
            
        }); 
        
    </script>
    
</body>

</html>
