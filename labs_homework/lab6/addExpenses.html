<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>
<body>
    <div>
        <form id="expenses" style="display: flex; flex-direction: column;" class="container mt-4">
            <h1>Add Expenses</h1>
            <div class="mb-3">
                
              <label for="name" class="form-label">Place of expense: </label>
                <input
                    class="form-control"
                    type="text"
                    id="sourceName"
                    required
                    title="you must enter a name"    
                >
            </div> 

            <div class="mb-3">
                <label for="date" >Date: </label>
                <input
                    class="form-control"
                    type="datetime-local"
                    id="amount"
                    required
                    title="Please enter the amount"
                >
            </div>

            <div class="mb-3">
                <label for="Amount" >Expense Amount: </label>
                <input
                    class="form-control"
                    type="number"
                    id="amount"
                    required
                    title="Please enter the amount"
                >
            </div>


            <div class="mb-3">
                <label for="frequency" class="form-label">Frequency: </label>
                    <select name="frequency" id="frequency" class="form-control" style="appearance:auto;">
                        <option  value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                        <option value="bi-weekly">Bi-Weekly</option>  
                    </select>
            </div>


            <div class="mb-3">
                <label for="textBox" class="form-label">Rational(optional if reason is ridiculous): </label>
                <input 
                    class="form-control"
                    type="text"
                    maxlength="100"
                    id="textBox"
                    required
                    
                >
            </div>



            <div>
              <button type="submit" class="btn btn-primary guessSubmit" >Submit</button>
            </div>



        </form>
    </div>
    
    
</body>
    <script>

    </script>
</html>
