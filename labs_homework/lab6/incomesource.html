<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Source</title>
    <style>
        form{
            display:flex;
            flex-direction: column;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">


</head>
<body>
    <div>
        <form id="addIncome" class="container">
            <h1>Add Income</h1>
            <div class="mb-3">
              <label for="name" class="form-label">Income Source Name: </label>
                <input
                    class="form-control"
                    type="text"
                    id="sourceName"
                    required
                    title="you must enter a name"    
                >
            </div> 

            <div class="mb-3">
                <label for="Amount" >Amount: </label>
                <input
                    class="form-control"
                    type="number"
                    id="amount"
                    required
                    title="Please enter the amount"
                >
            </div>

            <div class="mb-3">
                <label for="frequency" class="form-label">Frequency: </label>
                    <select name="frequency" id="frequency" class="form-control" style="appearance:auto;">
                        <option  value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                        <option value="bi-weekly">Bi-Weekly</option>  
                    </select>
            </div>

            <div>
              <button type="submit" class="btn btn-primary guessSubmit" >Submit</button>
            </div>
        </form>
    </div>

    

    <script>
        document.getElementById("addIncome").addEventListener("submit", function(e) {
            e.preventDefault(); // Stop the form from submitting automatically


            const sourceName = document.getElementById("sourceName").value;
            console.log(sourceName);
            const amount = document.getElementById("amount").value;
            const frequency = document.getElementById("frequency").value;


            // Log to console (or do whatever you need with the data)
            console.log("Form submitted successfully!");
            console.log("source Name:", sourceName);
            console.log("Amount: $", amount);
            console.log("Frequency: ", frequency)
            
        }); 
    </script>

    
</body>
</html>
