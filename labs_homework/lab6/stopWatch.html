<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .container{
            min-width: 200px;
            width: 80vw;
            max-width: 550px;
            min-height: 400px;        
            border-radius: 10px;
            border: 1px solid gray;
            display:flex;
            justify-content: space-around;
            align-items:center;
            flex-direction: column;
            
            padding: 2vw;
            position: relative;
            top: 5vw; 
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Stop Watch Demo</h1>
        <h1 id="outPlace">0 s</h1>
        <selection style="display:flex; gap: 30px;">
            <button id="start" type="Submit" class="btn btn-primary guessSubmit">Start</button>
            <button id="stop" type="Submit" class="btn btn-primary guessSubmit" style="background-color: red; border-color: red;">Stop</button>

        </selection>
        
    </div>
    <script>
        let intervalId = null; // save the interval ID here
        let num = 0;

        function increment(){
            num++;
            console.log(num);
            document.getElementById("outPlace").innerText= num + " s";
            
        }
        
        document.getElementById("start").addEventListener('click', function() {
            if(intervalId) return;
            intervalId = setInterval(increment,1000); //keeps tracks of timer
        });

        document.getElementById("stop").addEventListener('click',function(){
            clearInterval(intervalId);
            intervalId=null;

        });

    </script>
</body>
</html>
